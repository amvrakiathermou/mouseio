<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17302d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Museum</title>
<style>
:root{--bg:#17302d;--panel:#1f3f3b;--ink:#f3efe4;--brass:#d2a84c;--mute:#a9bdb8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;-webkit-tap-highlight-color:transparent}
button{font-family:system-ui,sans-serif;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
#welcome{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;text-align:center}
#welcome h1{font-size:clamp(2rem,6vw,3.4rem);margin:0;max-width:18ch;line-height:1.15}
#welcome p{margin:0;font:18px system-ui,sans-serif;color:var(--mute)}
.langs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.langs button{font-size:20px;font-weight:600;min-width:150px;min-height:60px;padding:12px 24px;border-radius:10px;border:2px solid var(--brass);background:transparent;color:var(--ink)}
.langs button[aria-pressed="true"],#welcome .langs button:active{background:var(--brass);color:#2a2110}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:2px solid var(--brass)}
header h1{margin:0;font-size:1.4rem}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 20px;background:var(--panel)}
nav button{font-size:18px;font-weight:600;white-space:nowrap;color:var(--ink);background:transparent;border:1.5px solid var(--mute);border-radius:999px;padding:10px 22px;min-height:52px}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding:20px}
.card{background:var(--panel);border:0;border-radius:10px;overflow:hidden;padding:0;color:var(--ink);text-align:start;display:block;width:100%}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#12261f;display:block}
.card h2{margin:0;padding:14px 16px;font-size:1.3rem}
footer{padding:10px 20px 20px;font:14px system-ui,sans-serif;color:var(--mute)}
#retry{margin-left:10px;font-size:15px;font-weight:600;background:var(--brass);color:#2a2110;border:0;border-radius:8px;padding:8px 14px;min-height:44px}
#detail{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:5;padding:20px}
#detail .wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#detail img{width:100%;max-height:55vh;object-fit:contain;background:#12261f;border-radius:10px}
#detail h2{margin:0;font-size:2rem}
#detail p{margin:0;font:20px/1.6 system-ui,sans-serif;color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-size:19px;font-weight:600;min-height:60px;padding:12px 26px;border-radius:10px;border:2px solid var(--brass);background:transparent;color:var(--brass)}
.btn[aria-pressed="true"]{background:var(--brass);color:#2a2110}
.btn.close{color:var(--ink);border-color:var(--mute)}
.qrbtn{font-size:17px;min-height:56px;padding:10px 22px}
#qr,#staff{position:fixed;inset:0;background:var(--bg);z-index:6;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:700px}
#qrimg{width:min(70vmin,420px);height:auto;background:#fff;border-radius:12px;display:block}
#qrtext{white-space:pre-line;margin:0;font:20px/1.6 system-ui,sans-serif}
.langs button.flag{width:46px;height:32px;min-width:0;min-height:0;padding:0;border-radius:5px;border:2px solid transparent;background-size:cover;background-position:center;opacity:.7}
.langs button.flag[aria-pressed="true"]{border-color:var(--brass);opacity:1}
#welcome{position:relative}
.wflags{flex-direction:column!important;flex-wrap:nowrap!important;align-items:center;gap:16px!important;margin-top:8px}
.frow{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;direction:ltr}
.btn.start{font-size:24px;min-width:240px;min-height:68px;background:var(--brass);color:#2a2110}
#wtitle,#title{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#staff .qrwrap{align-items:stretch;text-align:left;width:min(100%,640px)}
#staff h2{margin:0}#sinfo{white-space:pre-line;font:17px/1.7 system-ui,sans-serif;background:var(--panel);padding:14px 16px;border-radius:10px}
#sstatus{margin:0;min-height:1.4em;font:16px system-ui,sans-serif;color:var(--brass)}
.srow{display:flex;flex-direction:column;gap:10px}.srow .btn{min-height:54px;font-size:17px;text-align:left}
#pin,#sidle{font:20px system-ui,sans-serif;padding:12px;border-radius:8px;border:1.5px solid var(--mute);background:var(--panel);color:var(--ink);width:100%}
#pinmsg{margin:0;min-height:1.4em;font:16px system-ui,sans-serif;color:var(--brass)}
.langs{direction:ltr}#staff{direction:ltr}
.langs button.flag{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.btn.start,.btn.start2{width:min(92vw,520px);min-height:72px;font-size:22px;line-height:1.25}
.btn.start2{min-width:0}
.navbar{display:flex;gap:10px}
.nb{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:8px 18px;font:600 17px system-ui,sans-serif;border-radius:10px;border:1.5px solid var(--mute);background:transparent;color:var(--ink)}
.nb svg{width:26px;height:26px;flex:none}
html[dir="rtl"] .nb[data-act="back"] svg{transform:scaleX(-1)}
#detail .navbar,#qr .navbar{align-self:flex-start}
#bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--panel);border-top:2px solid var(--brass);padding-bottom:env(safe-area-inset-bottom)}
#bottomnav .nb{flex:1;justify-content:center;min-height:76px;border:0;border-radius:0;font-size:22px;gap:12px}
#bottomnav .nb svg{width:30px;height:30px}
#bottomnav .nb+.nb{border-inline-start:1px solid var(--mute)}
#bottomnav .nb:active{background:var(--ink);color:var(--bg)}
#app{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
#detail,#qr{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
#staff{z-index:9}
</style>
</head>
<body>

<section id="welcome">
  <h1 id="wtitle"></h1>
  <p id="wpick"></p>
  <button class="btn start" id="wstart"></button>
  <button class="btn start2" id="wqr"></button>
  <div class="langs flags wflags" id="wlangs"></div>
</section>

<div id="app" hidden>
  <header><h1 id="title"></h1></header>
  <nav id="menu"></nav>
  <main id="grid"></main>
  <footer><span id="status"></span><button id="retry" hidden></button></footer>
</div>

<section id="detail" hidden aria-modal="true" role="dialog">
  <div class="wrap">
    <img id="dimg" alt="">
    <h2 id="dtitle"></h2>
    <p id="dtext"></p>
    <div class="row"><button class="btn" id="dplay" aria-pressed="false"></button><button class="btn close" id="dclose" hidden></button></div>
  </div>
</section>

<section id="qr" hidden role="dialog" aria-modal="true">
  <div class="qrwrap">
    <img id="qrimg" src="qr.svg" alt="QR">
    <p id="qrtext"></p>
    <button class="btn close" id="qrclose" hidden></button>
  </div>
</section>

<div id="bottomnav" data-nav hidden></div>

<section id="staff" hidden role="dialog" aria-modal="true">
  <div class="qrwrap">
    <div id="pinView">
      <h2>Μενού προσωπικού</h2><br>
      <input id="pin" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Κωδικός">
      <p id="pinmsg"></p>
      <div class="row"><button class="btn" id="pinok">OK</button><button class="btn close" id="pinx">Ακύρωση</button></div>
    </div>
    <div id="panelView" hidden class="srow">
      <h2>Μενού προσωπικού</h2>
      <div id="sinfo"></div><p id="sstatus"></p>
      <button class="btn" id="supd"></button>
      <button class="btn" id="sapp">Έλεγχος για νέα έκδοση της εφαρμογής</button>
      <button class="btn" id="sload">Φόρτωση από τη συσκευή (επιλογή αρχείων)</button>
      <label style="font:17px system-ui,sans-serif">Χρόνος αδράνειας<br><select id="sidle"><option value="60">1 λεπτό</option><option value="180">3 λεπτά</option><option value="300">5 λεπτά</option><option value="600">10 λεπτά</option></select></label>
      <button class="btn" id="shome">Επιστροφή στην αρχική οθόνη</button>
      <button class="btn" id="swipe">Σβήσιμο όλων των δεδομένων του tablet</button>
      <button class="btn close" id="sclose">✕ Κλείσιμο</button>
      <input type="file" id="sfile" multiple hidden accept="image/*,audio/*,.json,.mp3,.m4a,.aac,.ogg,.wav,.jpg,.jpeg,.png,.webp">
    </div>
  </div>
</section>

  zh:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 40'><rect width='60' height='40' fill='#de2910'/><polygon fill='#ffde00' points='10,4 11.8,8.5 16.6,8.7 12.9,11.7 14.1,16.3 10,13.7 5.9,16.3 7.1,11.7 3.4,8.7 8.2,8.5'/><circle cx='21' cy='4' r='1.3' fill='#ffde00'/><circle cx='24' cy='8' r='1.3' fill='#ffde00'/><circle cx='24' cy='13' r='1.3' fill='#ffde00'/><circle cx='21' cy='17' r='1.3' fill='#ffde00'/></svg>",
  ar:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 40'><rect width='60' height='13.4' fill='#000'/><rect y='13.3' width='60' height='13.4' fill='#fff'/><rect y='26.6' width='60' height='13.4' fill='#007a3d'/><path d='M0 0L24 20L0 40z' fill='#ce1126'/></svg>",
  es:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 40'><rect width='60' height='40' fill='#aa151b'/><rect y='10' width='60' height='20' fill='#f1bf00'/></svg>",
  ja:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 40'><rect width='60' height='40' fill='#fff'/><circle cx='30' cy='20' r='12' fill='#bc002d'/></svg>"
};
const flagUrl = c => 'url("data:image/svg+xml,' + encodeURIComponent(FLAGS[c]) + '")';
function buildLangButtons() {
  const host = $("wlangs"); host.innerHTML = "";
  const rows = [document.createElement("div"), document.createElement("div")];
  rows.forEach(r => { r.className = "frow"; host.appendChild(r); });
  LANGS.forEach(([c, n], idx) => {
    const b = document.createElement("button"); b.className = "flag";
    b.style.backgroundImage = flagUrl(c); b.setAttribute("aria-label", n); b.title = n;
    b.setAttribute("aria-pressed", c === lang);
    if (!VISITOR && c === "el") longPress(b, 3000, () => { lpAt = Date.now(); openPin(); });
    b.onclick = () => { if (Date.now() - lpAt < 1000) return; lang = c; buildLangButtons(); welcomeText(); };
    rows[idx < FIRST_ROW ? 0 : 1].appendChild(b);
  });
}
function welcomeText() { $("wtitle").textContent = tr(DATA.title); $("wstart").textContent = TOUR[lang].tablet; $("wpick").textContent = ""; setQRButtons(); buildNav(); document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr"; }

function showWelcome() {
  audio.pause(); closeQR(true); closeDetail(true); lang = "el"; cat = "all"; setQRButtons();
  $("app").hidden = true; $("welcome").hidden = false;
  closeStaff(); welcomeText(); checkUpdate();
  buildLangButtons(); window.scrollTo(0, 0);
}
function enterApp() { $("welcome").hidden = true; $("app").hidden = false; renderApp(); keepAwake(); }

function renderApp() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("title").textContent = tr(DATA.title); document.title = tr(DATA.title);
  const cats = ["all", ...new Set(DATA.items.map(i => i.cat))];
  $("menu").innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c === "all" ? t("all") : (tr(DATA.categories && DATA.categories[c]) || c);
    b.setAttribute("aria-pressed", c === cat);
    b.onclick = () => { cat = c; renderApp(); };
    $("menu").appendChild(b);
  });
  $("grid").innerHTML = "";
  DATA.items.filter(i => cat === "all" || i.cat === cat).forEach(it => {
    const b = document.createElement("button"); b.className = "card";
    b.innerHTML = '<img alt=""><h2></h2>';
    b.querySelector("h2").textContent = tr(it.title);
    const im = b.querySelector("img"); im.src = imgSrc(it.img); im.alt = tr(it.title);
    b.onclick = () => openDetail(it);
    $("grid").appendChild(b);
  });
  $("retry").textContent = t("retry"); setQRButtons(); buildNav();
}

/* Κωδικός QR για το κινητό του επισκέπτη (μόνο από την αρχική οθόνη) */
function setQRButtons() {
  $("wqr").hidden = VISITOR;
  $("wqr").textContent = TOUR[lang].phone;
}
function openQR() {
  buildNav();
  const q = QR_UI[lang] || QR_UI.el;
  $("qrtext").textContent = q.help;
  $("qrclose").textContent = "✕ " + q.close;
  $("qr").hidden = false; history.pushState({q:1}, "");
}
function closeQR(silent) {
  if ($("qr").hidden) return;
  $("qr").hidden = true;
  if (!silent && history.state && history.state.q) history.back();
}
$("wqr").onclick = openQR;
$("qrclose").onclick = () => closeQR();

/* Μεγάλη σελίδα εκθέματος */
function openDetail(it) { openItem = it; $("detail").hidden = false; refreshDetail(); history.pushState({d:1}, ""); }
function refreshDetail() {
  if (!openItem) return;
  buildNav();
  $("dimg").src = imgSrc(openItem.img); $("dimg").alt = tr(openItem.title);
  $("dtitle").textContent = tr(openItem.title); $("dtext").textContent = tr(openItem.text);
  $("dclose").textContent = "✕ " + t("close"); setPlay(playing);
}
function closeDetail(silent) {
  if (!openItem) return;
  audio.pause(); playing = false; openItem = null; $("detail").hidden = true;
  if (!silent && history.state && history.state.d) history.back();
}
window.addEventListener("popstate", () => { if (!$("qr").hidden) closeQR(true); else if (openItem) closeDetail(true); });
$("dclose").onclick = () => closeDetail();

/* Ήχος */
function setPlay(on) {
  playing = on; const b = $("dplay");
  b.setAttribute("aria-pressed", on); b.textContent = (on ? "❚❚ " + t("pause") : "▶ " + t("listen"));
}
async function audioSrc(base) {
  if (hasExt(base)) return base;
  if (RES[base]) return RES[base];
  for (const u of cands(base, AUD_EXT)) {
    try { const r = await fetch(u, {method:"HEAD"}); if (r.ok) { RES[base] = u; return u; } } catch (_) {}
  }
  throw 0;
}
$("dplay").onclick = async () => {
  if (playing) { audio.pause(); setPlay(false); return; }
  try { audio.src = await audioSrc(openItem.audio); await audio.play(); setPlay(true); }
  catch (_) { setStatus(t("nosound")); }
};
audio.onended = () => setPlay(false);

/* Λήψη αρχείων στο tablet */
async function syncMedia() {
  if (!("caches" in window)) return;
  const name = "media-v" + DATA.version, cache = await caches.open(name);
  const jobs = []; DATA.items.forEach(i => { jobs.push([i.img, IMG_EXT]); jobs.push([i.audio, AUD_EXT]); });
  const before = JSON.stringify(RES); let done = 0, failed = 0;
  $("retry").hidden = true;
  for (const [base, exts] of jobs) {
    const list = cands(base, exts); let found = null;
    for (const u of list) if (await cache.match(u)) { found = u; break; }
    if (!found && navigator.onLine) for (const u of list) {
      try { const r = await fetch(u); if (r.ok) { await cache.put(u, r); found = u; break; } } catch (_) {}
    }
    if (found) { if (found !== base) RES[base] = found; } else failed++;
    done++; setStatus(`${t("check")} ${done}/${jobs.length}…`);
  }
  try { localStorage.setItem("mm-res", JSON.stringify(RES)); } catch (_) {}
  if (JSON.stringify(RES) !== before && !$("app").hidden) { renderApp(); refreshDetail(); }
  if (failed) { setStatus(`${t("missing")}: ${failed}`); $("retry").hidden = false; return; }
  (await caches.keys()).filter(k => k.startsWith("media-") && k !== name).forEach(k => caches.delete(k));
  setStatus(t("ready"));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
}
$("retry").onclick = syncMedia;
window.addEventListener("online", () => DATA && !LOCAL && !VISITOR && syncMedia());

/* Επιστροφή στην αρχική οθόνη μετά από αδράνεια */
function bump() {
  clearTimeout(idleTimer);
  if (!DATA || VISITOR) return;
  idleTimer = setTimeout(() => { if (!$("welcome").hidden) return; showWelcome(); }, (Number(localStorage.getItem("mm-idle")) || DATA.idleSeconds || 180) * 1000);
}
["pointerdown","keydown","touchstart"].forEach(e => document.addEventListener(e, bump, {passive:true}));

/* Η οθόνη να μένει ανοιχτή */
async function keepAwake() { if (VISITOR) return; try { if ("wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); } catch (_) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("app").hidden) keepAwake(); });


/* ===== Αυτόματη ενημέρωση του κώδικα της εφαρμογής ===== */
let lastCheck = 0;
async function checkUpdate() {
  if (VISITOR || !navigator.onLine || Date.now() - lastCheck < 300000) return;
  lastCheck = Date.now();
  try {
    const txt = await (await fetch("index.html?nc=" + Date.now(), {cache: "no-store"})).text();
    const m = new RegExp("BUILD" + " = \"([^\"]+)\"").exec(txt);
    if (!m || m[1] === BUILD || sessionStorage.getItem("mm-upd") === m[1]) return;
    sessionStorage.setItem("mm-upd", m[1]);
    (await caches.keys()).filter(k => k.startsWith("shell-")).forEach(k => caches.delete(k));
    for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    location.reload();
  } catch (_) {}
}

/* ===== Κρυφό μενού προσωπικού ===== */
function setStatus(x) { $("status").textContent = x; const e = $("sstatus"); if (e) e.textContent = x; }
async function sha(x) {
  if (!(window.crypto && crypto.subtle)) return "";
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("mm2027|" + x));
  return [...new Uint8Array(b)].map(v => v.toString(16).padStart(2, "0")).join("");
}
function longPress(el, ms, fn) {
  let tm; const c = () => clearTimeout(tm);
  el.addEventListener("pointerdown", () => { c(); tm = setTimeout(fn, ms); });
  ["pointerup","pointerleave","pointercancel"].forEach(e => el.addEventListener(e, c));
  el.addEventListener("contextmenu", e => e.preventDefault());
}
function openPin() {
  $("staff").hidden = false; $("pinView").hidden = false; $("panelView").hidden = true;
  $("pin").value = ""; $("pinmsg").textContent = ""; $("pin").focus();
}
function closeStaff() { $("staff").hidden = true; }
let fails = 0, lockUntil = 0;
$("pinok").onclick = async () => {
  if (Date.now() < lockUntil) { $("pinmsg").textContent = "Περίμενε " + Math.ceil((lockUntil - Date.now()) / 1000) + " δευτ."; return; }
  if (await sha($("pin").value.trim()) === PIN_HASH) {
    fails = 0; $("pinView").hidden = true; $("panelView").hidden = false;
    $("supd").textContent = LOCAL ? "Επιστροφή σε λειτουργία ίντερνετ" : "Ενημέρωση από το ίντερνετ (νέα λήψη όλων)";
    $("sidle").value = String(Number(localStorage.getItem("mm-idle")) || DATA.idleSeconds || 180);
    setStatus(""); refreshInfo();
  } else {
    $("pin").value = ""; fails++;
    if (fails >= 3) { fails = 0; lockUntil = Date.now() + 30000; $("pinmsg").textContent = "Κλειδώθηκε για 30 δευτερόλεπτα."; }
    else $("pinmsg").textContent = "Λάθος κωδικός.";
  }
};
$("pin").addEventListener("keydown", e => { if (e.key === "Enter") $("pinok").click(); });
$("pinx").onclick = $("sclose").onclick = closeStaff;

async function countFiles() {
  const names = (await caches.keys()).filter(k => k.startsWith("media-")); let ok = 0, total = 0;
  for (const it of DATA.items) for (const [b, ex] of [[it.img, IMG_EXT], [it.audio, AUD_EXT]]) {
    total++; let f = false;
    for (const n of names) { const c = await caches.open(n); for (const u of cands(b, ex)) if (await c.match(u)) { f = true; break; } if (f) break; }
    if (f) ok++;
  }
  return {ok, total};
}
async function refreshInfo() {
  const {ok, total} = await countFiles(); let e = {};
  try { e = await navigator.storage.estimate(); } catch (_) {}
  const sz = x => x == null ? "?" : x >= 1073741824 ? (x / 1073741824).toFixed(1) + " GB" : Math.round(x / 1048576) + " MB";
  $("sinfo").textContent = [
    "Έκδοση εφαρμογής: " + BUILD + " · περιεχομένου: " + DATA.version,
    "Αρχεία: " + ok + " από " + total + " αποθηκευμένα" + (ok < total ? "  ⚠ λείπουν" : "  ✔"),
    "Χώρος σε χρήση: " + sz(e.usage) + " · ελεύθερος: " + sz(e.quota - e.usage),
    "Σύνδεση ίντερνετ: " + (navigator.onLine ? "ναι" : "όχι"),
    "Λειτουργία: " + (LOCAL ? "τοπική (αρχεία της συσκευής)" : "κανονική (από το GitHub)")
  ].join("\n");
}
async function forceUpdate() {
  if (!navigator.onLine) { setStatus("Χρειάζεται σύνδεση στο ίντερνετ."); return; }
  try { DATA = await (await fetch("exhibits.json", {cache:"no-store"})).json(); } catch (_) { setStatus("Δεν ήταν δυνατή η λήψη της λίστας."); return; }
  await Promise.all((await caches.keys()).filter(k => k.startsWith("media-")).map(k => caches.delete(k)));
  RES = {}; try { localStorage.removeItem("mm-res"); } catch (_) {}
  await syncMedia(); refreshInfo();
}
async function exitLocal() {
  ["mm-local","mm-local-data","mm-res"].forEach(k => localStorage.removeItem(k));
  await caches.delete("media-local"); location.reload();
}
async function importLocal(files) {
  files = [...files]; const j = files.find(f => /exhibits\.json$/i.test(f.name));
  if (!j) { setStatus("Λείπει το αρχείο exhibits.json από την επιλογή."); return; }
  let data; try { data = JSON.parse(await j.text()); } catch (_) { setStatus("Το exhibits.json έχει λάθος."); return; }
  setStatus("Αποθήκευση αρχείων…");
  await caches.delete("media-local"); const c = await caches.open("media-local"); const res = {};
  for (const f of files) {
    if (f === j) continue;
    const isA = f.type.startsWith("audio") || /\.(mp3|m4a|aac|ogg|wav)$/i.test(f.name);
    const path = (isA ? "audio/" : "img/") + f.name;
    await c.put(new URL(path, location.href).href, new Response(f, {headers: {"Content-Type": f.type || (isA ? "audio/mpeg" : "image/jpeg")}}));
    res[path.replace(/\.[^.\/]+$/, "")] = path;
  }
  localStorage.setItem("mm-local-data", JSON.stringify(data)); localStorage.setItem("mm-res", JSON.stringify(res)); localStorage.setItem("mm-local", "1");
  location.reload();
}
$("supd").onclick = () => LOCAL ? exitLocal() : forceUpdate();
$("sapp").onclick = async () => { lastCheck = 0; sessionStorage.removeItem("mm-upd"); setStatus("Έλεγχος…"); await checkUpdate(); setStatus(navigator.onLine ? "Η εφαρμογή είναι στην τελευταία έκδοση." : "Χρειάζεται σύνδεση στο ίντερνετ."); };
$("sload").onclick = () => $("sfile").click();
$("sfile").onchange = e => importLocal(e.target.files);
$("sidle").onchange = e => { localStorage.setItem("mm-idle", e.target.value); bump(); setStatus("Αποθηκεύτηκε."); };
$("shome").onclick = () => showWelcome();
$("wstart").onclick = enterApp;
$("swipe").onclick = async () => {
  if (!confirm("Να σβηστούν ΟΛΑ τα δεδομένα του tablet;") || !confirm("Σίγουρα; Θα χρειαστεί νέα λήψη με wifi.")) return;
  localStorage.clear(); await Promise.all((await caches.keys()).map(k => caches.delete(k)));
  try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (_) {}
  location.reload();
};

if (!VISITOR && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
load(); bump();
</script>
