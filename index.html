<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Μουσικοί της Αμβρακιάς – demo</title>
<style>
:root{--bg:#14302d;--pn:#1f4440;--ink:#f3efe4;--br:#d2a84c;--mu:#a9bdb8;--paper:#f7f2e6;--tx:#2b2418;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,serif;padding-top:env(safe-area-inset-top)}
button{font:inherit;cursor:pointer;color:inherit}
#app{max-width:1100px;margin:0 auto;padding:18px 18px 150px}
h1{font-size:2rem;margin:.2em 0}h2{margin:.2em 0 .6em}
.sub{color:var(--mu);font:15px system-ui,sans-serif}
.center{text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--pn);border:0;border-radius:12px;overflow:hidden;text-align:left;padding:0;display:block;width:100%}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#0e2321}
.card .b{padding:12px 14px}.card b{display:block;font-size:1.1rem}
.tile{background:var(--pn);border:1.5px solid #34605a;border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.tile .ic{font-size:1.8rem}.tile b{display:block}.tile small{color:var(--mu);font:14px system-ui,sans-serif}
.gt{color:var(--br);letter-spacing:.12em;font:700 13px system-ui,sans-serif;margin:22px 0 8px;text-transform:uppercase}
.btn{font:600 18px system-ui,sans-serif;border:2px solid var(--br);background:transparent;border-radius:10px;padding:14px 22px;min-height:56px}
.btn.gold{background:var(--br);color:#2a2110}
.hero{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.hero img{width:min(260px,40vw);aspect-ratio:3/4;object-fit:cover;border-radius:14px}
.chip{display:inline-block;border:1.5px solid var(--br);border-radius:999px;padding:6px 14px;margin:4px 6px 4px 0;background:transparent;font:15px system-ui,sans-serif}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.acts .btn{text-align:left}
.paper{background:var(--paper);color:var(--tx);border-radius:14px;padding:26px 30px;font-size:1.25rem;line-height:1.7}
.paper blockquote{border-left:4px solid var(--br);margin:0 0 18px;padding-left:16px;font-style:italic}
.row{display:flex;gap:14px;align-items:center;background:var(--pn);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.play{width:54px;height:54px;border-radius:50%;border:2px solid var(--br);background:transparent;font-size:20px;flex:none}
.play[aria-pressed=true]{background:var(--br);color:#2a2110}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--pn);border-top:2px solid var(--br);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
#np{display:none;align-items:center;gap:12px;padding:8px 16px;font:15px system-ui,sans-serif;border-bottom:1px solid #34605a}
#nav{display:flex}#nav button{flex:1;min-height:68px;border:0;background:transparent;font:600 20px system-ui,sans-serif}
#nav button+button{border-left:1px solid #34605a}
#lb{position:fixed;inset:0;background:#0b1b19;z-index:8;display:none;overflow:auto;padding:16px 16px 120px}
#lb img,.vid{width:100%;max-height:68vh;object-fit:contain;border-radius:10px}
.vid{background:#000}
.foot{margin-top:30px;color:var(--mu);font:14px system-ui,sans-serif;text-align:center}
</style></head><body>
<div id="app"></div><div id="lb"></div>
<div id="bar"><div id="np"><span id="npt" style="flex:1"></span><button class="chip" id="npb">❚❚</button></div>
<div id="nav"><button id="back">← Πίσω</button><button id="home">⌂ Αρχική</button></div></div>
<script src="data.js"></script>
<script>
const D = DATA, $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SEC = [
 {k:"musicians",t:"Οι μουσικοί μας",s:"Πρόσωπα και βιογραφίες",g:0,i:"👥"},{k:"families",t:"Μουσικές οικογένειες",s:"Οικογενειακές μουσικές διαδρομές",g:0,i:"🏠"},
 {k:"testimonies",t:"Μαρτυρίες και αφηγήσεις",s:"Μνήμες και προσωπικές ιστορίες",g:0,i:"🎙"},{k:"newgen",t:"Η νέα γενιά",s:"Μουσική εκπαίδευση και συνέχεια",g:0,i:"🎓"},
 {k:"instruments",t:"Μουσικά όργανα",s:"Όργανα και δεξιοτέχνες",g:1,i:"🎻"},{k:"recordings",t:"Ηχογραφήσεις",s:"Τραγούδια και μουσικά ακούσματα",g:1,i:"🎧"},
 {k:"videos",t:"Βίντεο",s:"Εμφανίσεις και μουσικές στιγμές",g:1,i:"🎬"},{k:"photos",t:"Φωτογραφικό αρχείο",s:"Ιστορικές και σύγχρονες εικόνες",g:2,i:"🖼"},
 {k:"events",t:"Πανηγύρια και εκδηλώσεις",s:"Η μουσική ζωή του χωριού",g:2,i:"📅"},{k:"history",t:"Ιστορική διαδρομή",s:"Η μουσική στον χρόνο",g:2,i:"🏛"}];
const GROUPS = ["Άνθρωποι","Μουσική","Μνήμη"];
const by = (k, id) => D[k].find(x => x.id === id);
const img = pid => { const p = by("photos", pid); return p ? p.file : ""; };
const years = m => m.born ? m.born + (m.died ? "–" + m.died : " (ζει)") : "";
const chips = (ids, k) => (ids || []).map(id => `<button class="chip" data-go="item" data-k="${k}" data-id="${id}">${esc(by(k, id)?.name || by(k, id)?.title)}</button>`).join("");
const cnt = (a, label, v, id) => a && a.length ? `<button class="btn" data-go="sub" data-id="${id}" data-v="${v}">${label} (${a.length})</button>` : "";
let stack = [{v:"home"}], cur = null;
const audio = new Audio(); let playId = null;

function go(s) { stack.push(s); render(); window.scrollTo(0, 0); }
function back() { if (!$("lb").style.display || $("lb").style.display === "none") { if (stack.length > 1) stack.pop(); } else $("lb").style.display = "none"; render(); }
function render() {
  const s = stack[stack.length - 1]; cur = s; let h = "";
  $("back").style.visibility = $("home").style.visibility = s.v === "home" ? "hidden" : "visible";
  if (s.v === "home") h = `<div class="center" style="padding-top:12vh"><div class="sub">ΨΗΦΙΑΚΟ ΜΟΥΣΕΙΟ · DEMO</div><h1>Οι μουσικοί της Αμβρακιάς</h1><p class="sub">Μια ζωντανή διαδρομή στη μουσική μας παράδοση</p><p><button class="btn gold" data-go="menu" style="font-size:24px;padding:18px 36px">Έναρξη ξενάγησης</button></p><p class="foot">Δοκιμαστικά στοιχεία · 5 φανταστικοί μουσικοί · οι εικόνες είναι σχέδια</p></div>`;
  else if (s.v === "menu") h = `<h2 class="center">Κεντρικό μενού</h2>` + GROUPS.map((g, gi) => `<div class="gt">${g}</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">` + SEC.map((c, i) => c.g === gi ? `<button class="tile" data-go="list" data-k="${c.k}"><span class="ic">${c.i}</span><span><b>${String(i + 1).padStart(2, "0")} · ${c.t}</b><small>${c.s}</small></span></button>` : "").join("") + `</div>`).join("");
  else if (s.v === "list") h = list(s.k);
  else if (s.v === "item") h = item(s.k, s.id);
  else if (s.v === "sub") h = sub(s.id, s.sv || s.v2);
  $("app").innerHTML = h;
}
function list(k) {
  const c = SEC.find(x => x.k === k), a = D[k]; let h = `<h2>${c.t}</h2><div class="sub">${c.s}</div><br>`;
  if (!a.length) return h + `<p class="sub">Δεν υπάρχουν ακόμα εγγραφές.</p>`;
  if (k === "recordings") return h + a.map(r => recRow(r)).join("");
  if (k === "musicians") return h + `<div class="grid">` + a.map(m => `<button class="card" data-go="item" data-k="musicians" data-id="${m.id}"><img src="${img(m.photo)}" alt=""><div class="b"><b>${esc(m.name)}</b><span class="sub">${years(m)}<br>${esc((m.inst || []).map(i => by("instruments", i).name).join(", "))}</span></div></button>`).join("") + `</div>`;
  if (["history", "testimonies", "events", "newgen"].includes(k)) return h + a.map(x => `<button class="tile" style="margin-bottom:10px" data-go="item" data-k="${k}" data-id="${x.id}"><span><b>${esc(x.title || x.name)}</b><small>${esc(x.period || x.date || x.when || "")}</small></span></button>`).join("");
  return h + `<div class="grid">` + a.map(x => `<button class="card" data-go="item" data-k="${k}" data-id="${x.id}"><img src="${x.file || img(x.cover)}" alt=""><div class="b"><b>${esc(x.name || x.title)}</b><span class="sub">${esc(x.cat || x.date || "")}</span></div></button>`).join("") + `</div>`;
}
function recRow(r) { return `<div class="row"><button class="play" data-play="${r.id}" aria-pressed="${playId === r.id}">${playId === r.id ? "❚❚" : "▶"}</button><div style="flex:1"><b>${esc(r.title)}</b><div class="sub">${esc(r.year || "")} ${esc(r.place || "")}</div><div>${chips(r.musicians, "musicians")}</div></div></div>`; }
function item(k, id) {
  const x = by(k, id); let h = "";
  if (k === "musicians") {
    h = `<div class="hero"><img src="${img(x.photo)}" alt=""><div style="flex:1;min-width:240px"><h1>${esc(x.name)}</h1><div class="sub">${years(x)}${x.origin ? " · " + esc(x.origin) : ""}</div><div style="margin:8px 0">${(x.inst || []).map(i => `<button class="chip" data-go="item" data-k="instruments" data-id="${i}">${esc(by("instruments", i).name)}</button>`).join("")}</div><p>${esc(x.tag || "")}</p>${x.groups ? `<div class="sub">Μουσικά σχήματα: ${esc(x.groups)}</div>` : ""}</div></div>
    <div class="acts"><button class="btn gold" data-go="sub" data-id="${id}" data-v="bio">📖 Βιογραφία</button>${cnt(x.photos, "🖼 Φωτογραφίες", "photos", id)}${cnt(x.recs, "🎧 Ηχογραφήσεις", "recs", id)}${cnt(x.vids, "🎬 Βίντεο", "vids", id)}${cnt(x.events, "📅 Εκδηλώσεις", "events", id)}${cnt(x.tes, "🎙 Μαρτυρίες", "tes", id)}${cnt(x.collab, "🤝 Συνεργάτες", "collab", id)}${x.fam ? `<button class="btn" data-go="item" data-k="families" data-id="${x.fam}">🏠 ${esc(by("families", x.fam).name)}</button>` : ""}</div>`;
  } else if (k === "photos") h = `<img class="vid" src="${x.file}" alt=""><h2>${esc(x.name)}</h2><div class="sub">${esc([x.year, x.place, x.src].filter(Boolean).join(" · "))}</div><div style="margin-top:8px">${chips(x.musicians, "musicians")}</div>`;
  else {
    const e = x.file || img(x.cover); h = (e ? `<img class="vid" style="max-height:40vh" src="${e}" alt="">` : "") + `<h2>${esc(x.name || x.title)}</h2><div class="sub">${esc(x.cat || x.date || x.period || x.when || "")}</div>${x.text || x.desc ? `<div class="paper" style="font-size:1.1rem;margin:12px 0">${esc(x.text || x.desc)}</div>` : ""}`;
    if (x.musicians) h += `<div class="gt">Μουσικοί</div>` + chips(x.musicians, "musicians");
    if (x.members) h += `<div class="gt">Μέλη</div>` + chips(x.members, "musicians");
    if (x.players) h += `<div class="gt">Ποιοι το έπαιζαν</div>` + chips(x.players, "musicians");
    if (x.narrator) h += `<div class="gt">Αφηγητής</div>` + chips([x.narrator], "musicians");
    if (k === "events" || k === "instruments") { const r = D.recordings.filter(r => k === "events" ? r.evt === id : (r.inst || []).includes(id)); if (r.length) h += `<div class="gt">Ηχογραφήσεις</div>` + r.map(recRow).join(""); }
    if (k === "events") { const ph = D.photos.filter(p => p.evt === id); if (ph.length) h += `<div class="gt">Φωτογραφίες</div><div class="grid">${ph.map(p => `<button class="card" data-go="item" data-k="photos" data-id="${p.id}"><img src="${p.file}" alt=""></button>`).join("")}</div>`; }
  }
  return h;
}
function sub(id, v) {
  const m = by("musicians", id), T = x => `<h2>${esc(m.name)}</h2>`;
  if (v === "bio") return `<div class="hero" style="margin-bottom:10px"><img src="${img(m.photo)}" style="width:90px;aspect-ratio:1" alt=""><div><h2 style="margin:0">${esc(m.name)}</h2><div class="sub">${years(m)}</div></div></div><div class="paper" id="bio">${m.quote ? `<blockquote>«${esc(m.quote)}»</blockquote>` : ""}${esc(m.bio).split("\n").map(p => `<p>${p}</p>`).join("")}</div><p class="center"><button class="btn" id="az">Α+ Μεγαλύτερα γράμματα</button></p>`;
  if (v === "photos") return T() + `<div class="grid">${m.photos.map(p => `<button class="card" data-go="item" data-k="photos" data-id="${p}"><img src="${by("photos", p).file}" alt=""><div class="b sub">${esc(by("photos", p).name)}</div></button>`).join("")}</div>`;
  if (v === "recs") return T() + m.recs.map(r => recRow(by("recordings", r))).join("");
  if (v === "vids") return T() + m.vids.map(i => { const x = by("videos", i); return `<h3>${esc(x.title)}</h3>${x.file ? `<video class="vid" controls src="${x.file}"></video>` : `<p class="sub">Δεν υπάρχει αρχείο.</p>`}${x.link ? `<p class="sub">Κινητά: ${esc(x.link)}</p>` : ""}`; }).join("");
  if (v === "events") return T() + m.events.map(i => `<button class="tile" style="margin-bottom:10px" data-go="item" data-k="events" data-id="${i}"><span><b>${esc(by("events", i).title)}</b><small>${esc(by("events", i).date || "")}</small></span></button>`).join("");
  if (v === "tes") return T() + m.tes.map(i => `<button class="tile" style="margin-bottom:10px" data-go="item" data-k="testimonies" data-id="${i}"><span><b>${esc(by("testimonies", i).title)}</b></span></button>`).join("");
  if (v === "collab") return T() + `<div class="gt">Συνεργάτες</div>` + chips(m.collab, "musicians");
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"), p = e.target.closest("[data-play]");
  if (p) return play(p.dataset.play);
  if (e.target.id === "az") { const b = $("bio"); b.style.fontSize = (parseFloat(getComputedStyle(b).fontSize) + 4) + "px"; return; }
  if (!g) return;
  const d = g.dataset;
  if (d.go === "menu") go({v:"menu"}); else if (d.go === "list") go({v:"list", k:d.k}); else if (d.go === "item") go({v:"item", k:d.k, id:d.id}); else if (d.go === "sub") go({v:"sub", id:d.id, sv:d.v});
});
function play(id) {
  const r = by("recordings", id);
  if (playId === id) { audio.pause(); playId = null; } else { audio.src = r.file; audio.play(); playId = id; $("npt").textContent = "♪ " + r.title; }
  $("np").style.display = playId ? "flex" : "none"; render();
}
$("npb").onclick = () => { audio.pause(); playId = null; $("np").style.display = "none"; render(); };
audio.onended = () => { playId = null; $("np").style.display = "none"; render(); };
$("back").onclick = back; $("home").onclick = () => { stack = [{v:"home"}]; render(); };
render();
</script></body></html>
