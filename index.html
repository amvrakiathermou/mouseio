<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17302d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Μουσείο Μουσικών Οργάνων</title>
<style>
:root{--bg:#17302d;--panel:#1f3f3b;--ink:#f3efe4;--brass:#d2a84c;--mute:#a9bdb8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:2px solid var(--brass)}
h1{margin:0;font-size:1.6rem}
#status{font:15px system-ui,sans-serif;color:var(--mute)}
#retry{font:600 16px system-ui,sans-serif;background:var(--brass);color:#2a2110;border:0;border-radius:8px;padding:12px 18px;min-height:48px;display:none}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 20px;background:var(--panel)}
nav button{font:600 18px system-ui,sans-serif;white-space:nowrap;color:var(--ink);background:transparent;border:1.5px solid var(--mute);border-radius:999px;padding:10px 22px;min-height:52px}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:20px}
article{background:var(--panel);border-radius:10px;overflow:hidden}
article img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#12261f;display:block}
.body{padding:14px 16px 16px}
h2{margin:0 0 6px;font-size:1.3rem}
p{margin:0 0 12px;font:16px/1.5 system-ui,sans-serif;color:var(--mute)}
.play{font:600 17px system-ui,sans-serif;width:100%;min-height:52px;background:transparent;color:var(--brass);border:1.5px solid var(--brass);border-radius:8px}
.play[aria-pressed="true"]{background:var(--brass);color:#2a2110}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1 id="title">Μουσείο Μουσικών Οργάνων</h1>
  <div><span id="status"></span> <button id="retry">Δοκίμασε ξανά τη λήψη</button></div>
</header>
<nav id="menu" aria-label="Μενού"></nav>
<main id="grid"></main>

<script>
const $ = id => document.getElementById(id);
let DATA = null, current = "Όλα", playingBtn = null;
const audio = new Audio();

/* 1. Φόρτωση λίστας εκθεμάτων (από δίκτυο ή από τη μνήμη του tablet) */
async function load() {
  try { DATA = await (await fetch("exhibits.json", {cache: "no-store"})).json(); }
  catch (_) { $("status").textContent = "Δεν βρέθηκαν δεδομένα. Συνδέσου στο ίντερνετ μία φορά."; return; }
  $("title").textContent = DATA.title || $("title").textContent;
  render();
  syncMedia();
}

/* 2. Σχεδίαση μενού και καρτών */
function render() {
  const cats = ["Όλα", ...new Set(DATA.items.map(i => i.cat))];
  $("menu").innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c; b.setAttribute("aria-pressed", c === current);
    b.onclick = () => { current = c; render(); };
    $("menu").appendChild(b);
  });
  $("grid").innerHTML = "";
  DATA.items.filter(i => current === "Όλα" || i.cat === current).forEach(it => {
    const a = document.createElement("article");
    a.innerHTML = '<img alt=""><div class="body"><h2></h2><p></p><button class="play" aria-pressed="false">▶ Ακρόαση</button></div>';
    a.querySelector("h2").textContent = it.title;
    a.querySelector("p").textContent = it.text;
    const img = a.querySelector("img"); img.alt = it.title; img.src = it.img;
    const btn = a.querySelector(".play");
    btn.onclick = () => toggle(btn, it);
    $("grid").appendChild(a);
  });
}

/* 3. Αναπαραγωγή */
function reset() { if (playingBtn) { playingBtn.setAttribute("aria-pressed","false"); playingBtn.textContent = "▶ Ακρόαση"; playingBtn = null; } }
async function toggle(btn, it) {
  if (playingBtn === btn) { audio.pause(); reset(); return; }
  audio.pause(); reset();
  try {
    audio.src = it.audio; await audio.play();
    playingBtn = btn; btn.setAttribute("aria-pressed","true"); btn.textContent = "❚❚ Παύση";
  } catch (_) { $("status").textContent = "Το κομμάτι δεν είναι διαθέσιμο. Συνδέσου στο ίντερνετ."; }
}
audio.onended = reset;

/* 4. Λήψη όλων των αρχείων στο tablet (μία φορά, και μετά μόνο ό,τι αλλάζει) */
async function syncMedia() {
  if (!("caches" in window)) return;
  const name = "media-v" + DATA.version;
  const urls = DATA.items.flatMap(i => [i.img, i.audio]);
  const cache = await caches.open(name);
  const missing = [];
  for (const u of urls) if (!(await cache.match(u))) missing.push(u);
  (await caches.keys()).filter(k => k.startsWith("media-") && k !== name).forEach(k => caches.delete(k));
  if (!missing.length) { $("status").textContent = "✔ Έτοιμο για χρήση χωρίς σύνδεση"; return; }
  if (!navigator.onLine) { $("status").textContent = "Χωρίς σύνδεση: λείπουν αρχεία"; return; }
  let done = 0, failed = 0;
  $("retry").style.display = "none";
  for (const u of missing) {
    try { const r = await fetch(u); if (!r.ok) throw 0; await cache.put(u, r); }
    catch (_) { failed++; }
    done++; $("status").textContent = `Λήψη ${done}/${missing.length}…`;
  }
  if (failed) { $("status").textContent = `Λείπουν ${failed} αρχεία`; $("retry").style.display = "inline-block"; }
  else $("status").textContent = "✔ Έτοιμο για χρήση χωρίς σύνδεση";
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
}
$("retry").onclick = syncMedia;
window.addEventListener("online", () => DATA && syncMedia());

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
load();
</script>
</body>
</html>
